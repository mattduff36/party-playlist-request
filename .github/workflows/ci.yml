# PartyPlaylist PR quality gates (PRD-05)
name: CI

on:
  pull_request:
  push:
    branches:
      - preview/partyplaylist-prd-program-2026
      - main
      - 'dev/**'

jobs:
  quality:
    name: type-check · lint · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        # Still fails on pre-existing @typescript-eslint/no-explicit-any debt.
        # Do NOT demote that rule to warn — clear the debt, then remove continue-on-error.
        # See docs/database/QUALITY_GATE_DEBT.md.
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          # Build must not require live secrets; vault fail-fast is production-only.
          NODE_ENV: production
          JWT_SECRET: ci-placeholder-jwt-secret-min-32-chars!!
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEXT_PUBLIC_APP_URL: http://localhost:3000
